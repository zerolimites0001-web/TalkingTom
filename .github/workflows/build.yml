name: Build TalkingTom APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk talkingtom.apk && ls -lh talkingtom.apk
      - uses: actions/upload-artifact@v4
        with: { name: talkingtom, path: talkingtom.apk }
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talking Tom v1.0.${{ github.run_number }}
          files: talkingtom.apk
          body: |
            ### 😺 Talking Tom Demo
            - SIM = troca wallpaper + som infinito aumentando a cada 1.8s
            - NÃO = vibra + balança tela
            Com permissão explícita.
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
